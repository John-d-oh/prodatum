name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master", "dev", "apple-silicon" ]
    tags: [ "v*" ]
  pull_request:

env:
  build_type: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is an Apple Silicon runner; we build a universal
          # (arm64 + x86_64) .app so one download works on every Mac.
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    steps:
    - name: Clone prodatum with FLTK and portmidi submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux packages
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libx11-dev libxext-dev libxinerama-dev libxft-dev libxcursor-dev \
          libxfixes-dev libxrender-dev libfontconfig1-dev \
          libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure (macOS, universal)
      if: runner.os == 'macOS'
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ env.build_type }}
        -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Configure
      if: runner.os != 'macOS'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.build_type }}

    - name: Build
      run: cmake --build build --config ${{ env.build_type }} --parallel

    # ----- macOS ------------------------------------------------------------
    - name: Package macOS app
      if: runner.os == 'macOS'
      run: |
        # Apple Silicon refuses to run unsigned arm64 code; an ad-hoc
        # signature is enough for a local run (after clearing quarantine).
        codesign --force --deep --sign - build/prodatum.app
        lipo -info build/prodatum.app/Contents/MacOS/prodatum
        codesign -dv build/prodatum.app
        ditto -c -k --keepParent build/prodatum.app build/prodatum-macos-universal.zip

    - name: Upload macOS artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: prodatum-macos
        path: build/prodatum-macos-universal.zip

    # ----- Linux ------------------------------------------------------------
    - name: Rename Linux artifact
      if: runner.os == 'Linux'
      run: mv build/prodatum build/prodatum-linux-x86_64

    - name: Upload Linux artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: prodatum-linux
        path: build/prodatum-linux-x86_64

    # ----- Windows ----------------------------------------------------------
    - name: Rename Windows artifact
      if: runner.os == 'Windows'
      run: mv build/${{ env.build_type }}/prodatum.exe build/${{ env.build_type }}/prodatum-win-x64.exe

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: prodatum-windows
        path: build/${{ env.build_type }}/prodatum-win-x64.exe

  release:
    name: Prepare release draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Retrieve build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate and verify SHA256 checksums
        working-directory: release
        run: |
          ls -al
          sha256sum prodatum-win-x64.exe prodatum-linux-x86_64 prodatum-macos-universal.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          files: |
            release/prodatum-win-x64.exe
            release/prodatum-linux-x86_64
            release/prodatum-macos-universal.zip
            release/SHA256SUMS.txt
